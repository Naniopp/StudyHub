services:
  - type: web
    name: socialhub
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: AI_MODEL
        value: openai/gpt-oss-120b
